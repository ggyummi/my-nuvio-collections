name: Generate Dynamic Backdrops

on:
  # Run automatically on the 1st of every month at midnight UTC
  schedule:
    - cron: '0 0 1 * *'

  # Also allow manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backdrop generator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/generate_backdrop.py

      - name: Commit and push generated backdrops
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backdrops/
          git diff --staged --quiet || git commit -m "🎬 Auto-update backdrops $(date +'%Y-%m-%d')"
          git push
